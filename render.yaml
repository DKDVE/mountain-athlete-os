services:
  - type: web
    name: maos-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: pnpm install && pnpm --filter @maos/shared build && pnpm --filter @maos/api build
    startCommand: node apps/api/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGIN
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL_DEFAULT
        value: openrouter/free
      - key: OPENROUTER_MODEL_PREMIUM
        value: deepseek/deepseek-v4-flash
