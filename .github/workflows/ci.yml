name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Require Supabase secrets for RLS suite
        run: |
          test -n "${{ secrets.SUPABASE_URL }}" || (echo "Missing secret SUPABASE_URL" && exit 1)
          test -n "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" || (echo "Missing secret SUPABASE_SERVICE_ROLE_KEY" && exit 1)
          test -n "${{ secrets.VITE_SUPABASE_ANON_KEY }}" || (echo "Missing secret VITE_SUPABASE_ANON_KEY" && exit 1)

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - run: pnpm build
        env:
          VITE_APP_BASE_PATH: /mountain-athlete-os
          VITE_API_BASE_URL: https://maos-api-dkdve.onrender.com
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_E2E_TEST_LOGIN: 'true'

      - name: Install Playwright browser
        run: pnpm exec playwright install chromium --with-deps

      - name: E2E (offline sync)
        run: |
          pnpm --filter @maos/web preview --port 4173 --strictPort --host 127.0.0.1 &
          for i in $(seq 1 60); do
            if curl -sf "http://127.0.0.1:4173/mountain-athlete-os/" >/dev/null; then break; fi
            sleep 2
          done
          curl -sf "http://127.0.0.1:4173/mountain-athlete-os/" || (echo "Preview server failed to start" && exit 1)
          pnpm exec playwright test
        env:
          PLAYWRIGHT_SKIP_WEBSERVER: 'true'
          VITE_APP_BASE_PATH: /mountain-athlete-os
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_APP_BASE_PATH: /mountain-athlete-os
          VITE_API_BASE_URL: https://maos-api-dkdve.onrender.com
          MAOS_SEED_EMAIL: seed@maos.local
          MAOS_SEED_PASSWORD: seedpass123
