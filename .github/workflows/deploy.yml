name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy-web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Require Supabase secrets for production build
        run: |
          test -n "${{ secrets.SUPABASE_URL }}" || (echo "Missing secret SUPABASE_URL" && exit 1)
          test -n "${{ secrets.VITE_SUPABASE_ANON_KEY }}" || (echo "Missing secret VITE_SUPABASE_ANON_KEY" && exit 1)

      - run: pnpm --filter @maos/shared build && pnpm --filter @maos/web build
        env:
          VITE_APP_BASE_PATH: /mountain-athlete-os
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_AUTH_REDIRECT_URLS: https://dkdve.github.io/mountain-athlete-os/,http://localhost:5173/mountain-athlete-os/,http://127.0.0.1:5173/mountain-athlete-os/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

      - id: deployment
        uses: actions/deploy-pages@v4

  deploy-api:
    runs-on: ubuntu-latest
    if: vars.RENDER_DEPLOY_HOOK_URL != ''
    steps:
      - run: curl -fsS -X POST "${{ vars.RENDER_DEPLOY_HOOK_URL }}"
